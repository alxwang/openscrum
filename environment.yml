name: openscrum
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    # FastAPI Server
    - fastapi>=0.104.0
    - uvicorn[standard]>=0.24.0
    - python-multipart>=0.0.6
    - websockets>=12.0
    
    # LangChain & LangGraph
    - langchain-core>=0.1.0
    - langchain-openai>=0.0.5
    - langchain-anthropic>=0.1.0
    - langgraph>=0.0.20
    
    # Textual TUI Client
    - textual>=0.45.0
    
    # HTTP Client
    - httpx>=0.25.0
    
    # Template Engine
    - jinja2>=3.1.0
    
    # Data Validation
    - pydantic>=2.5.0
    - pydantic-settings>=2.1.0
    
    # Type Hints
    - typing-extensions>=4.8.0
    
    # Additional utilities
    - markdownify>=0.11.6
    - python-dotenv>=1.0.0  # For webfetch tool HTML to markdown conversion
    - filelock>=3.13.0  # For session/storage file locking
